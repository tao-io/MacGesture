# Temporary CI for this worker branch only. Do not merge.
name: MACG-2 Xcode test and build

on:
  push:
    branches:
      - artile/MACG-2-recognize-left-first-two-button-chord-before-upward-drag

jobs:
  xcode:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadof
      GIT_CONFIG_VALUE_0: "git@github.com:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use full Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Fetch Swift packages over HTTPS
        run: |
          git config --global url.https://github.com/.insteadof "git@github.com:"
          git config --local url.https://github.com/.insteadof "git@github.com:"
          echo '=== git config --get-regexp url ==='
          git config --get-regexp url
          git ls-remote --heads "git@github.com:sparkle-project/Sparkle.git" HEAD >/dev/null

      - name: Test MacGesture scheme
        run: |
          xcodebuild test \
            -project MacGesture.xcodeproj \
            -scheme MacGesture \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -scmProvider system \
            CODE_SIGNING_ALLOWED=NO

      - name: Build MacGesture scheme
        run: |
          xcodebuild build \
            -project MacGesture.xcodeproj \
            -scheme MacGesture \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            -scmProvider system \
            CODE_SIGNING_ALLOWED=NO

      - name: Package MacGesture.app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Debug/MacGesture.app \
            MacGesture.app.zip

      - name: Upload MacGesture.app.zip
        uses: actions/upload-artifact@v4
        with:
          name: MacGesture.app.zip
          path: MacGesture.app.zip
          if-no-files-found: error
